name: Daily Credit Check

on:
  schedule:
    # 09:00 JST = 00:00 UTC
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (WIF)
        if: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER != '' && vars.GCP_SERVICE_ACCOUNT != '' }}
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Restore history cache
        id: history-cache-restore
        uses: actions/cache/restore@v4
        with:
          path: data
          key: history-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            history-${{ github.ref_name }}-

      - name: Setup uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --no-dev

      - name: Run credit monitor
        env:
          TARGET_BANGUMI_ID: ${{ vars.TARGET_BANGUMI_ID || secrets.TARGET_BANGUMI_ID }}
          TARGET_NAME: ${{ secrets.TARGET_NAME || vars.TARGET_NAME }}
          STATE_BACKEND: ${{ vars.STATE_BACKEND || 'firestore' }}
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          FIRESTORE_DATABASE: ${{ vars.FIRESTORE_DATABASE || '(default)' }}
          FIRESTORE_COLLECTION_PREFIX: ${{ vars.FIRESTORE_COLLECTION_PREFIX }}
          NOTIFY_RETRY_MAX_RETRIES: ${{ vars.NOTIFY_RETRY_MAX_RETRIES || '2' }}
          NOTIFY_RETRY_INITIAL_DELAY_SECONDS: ${{ vars.NOTIFY_RETRY_INITIAL_DELAY_SECONDS || '60' }}

          # Notification backend: console | email
          NOTIFIER: ${{ vars.NOTIFIER || secrets.NOTIFIER }}
          NOTIFIERS: ${{ vars.NOTIFIERS || secrets.NOTIFIERS }}

          # Email notifier settings (when NOTIFIER=email)
          SMTP_HOST: ${{ vars.SMTP_HOST || secrets.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT || secrets.SMTP_PORT }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          SMTP_TO: ${{ secrets.SMTP_TO }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_USE_TLS: ${{ vars.SMTP_USE_TLS || secrets.SMTP_USE_TLS }}
          EMAIL_SUBJECT_TEMPLATE: ${{ vars.EMAIL_SUBJECT_TEMPLATE || secrets.EMAIL_SUBJECT_TEMPLATE }}
          EMAIL_BODY_TEMPLATE: ${{ vars.EMAIL_BODY_TEMPLATE || secrets.EMAIL_BODY_TEMPLATE }}

          # DATA_DIR is only used when STATE_BACKEND=local
          DATA_DIR: data
        run: uv run --locked --no-dev animator-credit-monitor check

      - name: Ensure history directory exists
        run: mkdir -p data

      - name: Save history cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data
          key: history-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
