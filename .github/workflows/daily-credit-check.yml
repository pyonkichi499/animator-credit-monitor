name: Daily Credit Check

on:
  schedule:
    # 09:00 JST = 00:00 UTC
    - cron: "0 0 * * *"
  workflow_dispatch:

concurrency:
  group: daily-credit-check-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate workflow configuration
        shell: bash
        env:
          TARGET_BANGUMI_ID: ${{ vars.TARGET_BANGUMI_ID }}
          TARGET_NAME: ${{ secrets.TARGET_NAME || vars.TARGET_NAME }}
          STATE_BACKEND: ${{ vars.STATE_BACKEND || 'firestore' }}
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
          NOTIFIER: ${{ vars.NOTIFIER }}
          NOTIFIERS: ${{ vars.NOTIFIERS }}
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          SMTP_TO: ${{ secrets.SMTP_TO }}
        run: |
          set -euo pipefail
          errors=0
          err() {
            echo "::error::$1"
            errors=1
          }

          [[ -n "${TARGET_BANGUMI_ID:-}" || -n "${TARGET_NAME:-}" ]] \
            || err "TARGET_BANGUMI_ID or TARGET_NAME is required"

          case "${STATE_BACKEND}" in
            local | firestore) ;;
            *) err "STATE_BACKEND must be 'local' or 'firestore' (got '${STATE_BACKEND}')" ;;
          esac

          [[ -n "${NOTIFIER:-}" || -n "${NOTIFIERS:-}" ]] \
            || err "NOTIFIER or NOTIFIERS is required"

          if [[ "${STATE_BACKEND}" == "firestore" ]]; then
            [[ -n "${GCP_PROJECT_ID:-}" ]] \
              || err "GCP_PROJECT_ID is required when STATE_BACKEND=firestore"
            [[ -n "${GCP_WORKLOAD_IDENTITY_PROVIDER:-}" ]] \
              || err "GCP_WORKLOAD_IDENTITY_PROVIDER is required when STATE_BACKEND=firestore"
            [[ -n "${GCP_SERVICE_ACCOUNT:-}" ]] \
              || err "GCP_SERVICE_ACCOUNT is required when STATE_BACKEND=firestore"
          fi

          notifiers="${NOTIFIERS:-${NOTIFIER:-}}"
          if [[ ",${notifiers}," == *",email,"* ]]; then
            [[ -n "${SMTP_HOST:-}" ]] || err "SMTP_HOST is required for the email notifier"
            [[ -n "${SMTP_FROM:-}" ]] || err "SMTP_FROM is required for the email notifier"
            [[ -n "${SMTP_TO:-}" ]] || err "SMTP_TO is required for the email notifier"
          fi

          [[ "${errors}" -eq 0 ]] \
            || { echo "::error::Workflow configuration validation failed"; exit 1; }

      - name: Authenticate to Google Cloud (WIF)
        if: ${{ (vars.STATE_BACKEND || 'firestore') == 'firestore' }}
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Restore history cache
        if: ${{ (vars.STATE_BACKEND || 'firestore') == 'local' }}
        id: history-cache-restore
        uses: actions/cache/restore@v4
        with:
          path: data
          key: history-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            history-${{ github.ref_name }}-

      - name: Setup uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --no-dev

      - name: Run credit monitor
        env:
          TARGET_BANGUMI_ID: ${{ vars.TARGET_BANGUMI_ID }}
          TARGET_NAME: ${{ secrets.TARGET_NAME || vars.TARGET_NAME }}
          STATE_BACKEND: ${{ vars.STATE_BACKEND || 'firestore' }}
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          FIRESTORE_DATABASE: ${{ vars.FIRESTORE_DATABASE || '(default)' }}
          FIRESTORE_COLLECTION_PREFIX: ${{ vars.FIRESTORE_COLLECTION_PREFIX }}
          NOTIFY_RETRY_MAX_RETRIES: ${{ vars.NOTIFY_RETRY_MAX_RETRIES || '2' }}
          NOTIFY_RETRY_INITIAL_DELAY_SECONDS: ${{ vars.NOTIFY_RETRY_INITIAL_DELAY_SECONDS || '60' }}

          # Notification backend: console | email
          NOTIFIER: ${{ vars.NOTIFIER }}
          NOTIFIERS: ${{ vars.NOTIFIERS }}

          # Email notifier settings (when NOTIFIER=email)
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT || '587' }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          SMTP_TO: ${{ secrets.SMTP_TO }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_USE_TLS: ${{ vars.SMTP_USE_TLS || 'true' }}
          EMAIL_SUBJECT_TEMPLATE: ${{ vars.EMAIL_SUBJECT_TEMPLATE || '{title}' }}
          EMAIL_BODY_TEMPLATE: ${{ vars.EMAIL_BODY_TEMPLATE || '{message}' }}

          # DATA_DIR is only used when STATE_BACKEND=local
          DATA_DIR: data
        run: uv run --locked --no-dev animator-credit-monitor check

      - name: Ensure history directory exists
        if: ${{ always() && (vars.STATE_BACKEND || 'firestore') == 'local' }}
        run: mkdir -p data

      - name: Save history cache
        if: ${{ always() && (vars.STATE_BACKEND || 'firestore') == 'local' }}
        uses: actions/cache/save@v4
        with:
          path: data
          key: history-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
